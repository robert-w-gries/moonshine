# Machine-specific additions for this host (gitignored). Use with either GPU file:
#   docker compose -f docker-compose.nvidia.yml -f docker-compose.local.yml up
services:
  server:
    volumes:
      # Steam: main dir + the library that holds the games (libraryfolders.vdf).
      - ${HOST_HOME}/.local/share/Steam:${HOST_HOME}/.local/share/Steam:ro
      - /mnt/m2_1/rob:/mnt/m2_1/rob:ro
      # Lutris
      - ${HOST_HOME}/.local/share/lutris:${HOST_HOME}/.local/share/lutris:ro
      # Heroic (Flatpak)
      - ${HOST_HOME}/.var/app/com.heroicgameslauncher.hgl/config/heroic:${HOST_HOME}/.var/app/com.heroicgameslauncher.hgl/config/heroic:ro
      # Desktop entries + icons
      - ${HOST_HOME}/.local/share/applications:${HOST_HOME}/.local/share/applications:ro
      - ${HOST_HOME}/.local/share/icons:${HOST_HOME}/.local/share/icons:ro
      - /usr/share/applications:/usr/share/applications:ro
      - /usr/share/icons:/usr/share/icons:ro
      - /usr/share/pixmaps:/usr/share/pixmaps:ro
