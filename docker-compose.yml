# Local development environment for moonshine (https://github.com/hgaiser/moonshine).
# Local-only file — do not include in the upstream Dockerfile PR.
#
#   dev    — CI-identical build/test toolchain (no GPU, no devices, no host
#            session access). The everyday development loop.
#   server — runs the actual streaming server: GPU + input passthrough, host
#            user D-Bus (app launching via systemd --user), host networking.

name: moonshine-dev

x-build: &build
  context: .
  args:
    UID: "${HOST_UID:?set HOST_UID in .env (id -u)}"
    GID: "${HOST_GID:?set HOST_GID in .env (id -g)}"

x-common: &common
  build: *build
  image: moonshine-dev:local
  tty: true
  stdin_open: true
  environment:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    RENDER_GID: "${RENDER_GID}"

services:
  dev:
    <<: *common
    volumes:
      - .:/home/dev/moonshine
      - cargo-registry:/home/dev/.cargo/registry
      - cargo-git:/home/dev/.cargo/git
      - target:/home/dev/target

  server:
    <<: *common
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      #- /dev/dri:/dev/dri        # GPU (AMD/Intel). NVIDIA: see §10.
      - /dev/uinput:/dev/uinput  # keyboard/mouse injection
      - /dev/uhid:/dev/uhid      # gamepad emulation (needs host udev rules, §3)
    group_add:
      - "${RENDER_GID:?set RENDER_GID via `RENDER_GID=$(getent group render | cut -d: -f3) docker compose ...` or in .env}"
    cap_add:
      # Docker's default seccomp profile gates kcmp(2) behind CAP_SYS_PTRACE;
      # moonshine needs kcmp for DMA-BUF import cache validation (healthcheck FAIL otherwise).
      - SYS_PTRACE
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      XDG_RUNTIME_DIR: /run/user/${HOST_UID}
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/${HOST_UID}/bus
      MOONSHINE_LOG: ${MOONSHINE_LOG:-moonshine=info}
      # NVIDIA: have the container toolkit inject the graphics/video (EGL,
      # Vulkan, GBM, encode) userspace, not just compute/utility.
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - .:/home/dev/moonshine
      - cargo-registry:/home/dev/.cargo/registry
      - cargo-git:/home/dev/.cargo/git
      - target:/home/dev/target
      - ./dev-config:/home/dev/.config/moonshine
      # Host user session: D-Bus (systemd --user transient units), and the
      # Wayland + PulseAudio sockets moonshine creates must be visible to the
      # games it launches on the host (audio/mod.rs: $XDG_RUNTIME_DIR/moonshine/pulse/native).
      - /run/user/${HOST_UID}:/run/user/${HOST_UID}
      # System bus for logind sleep-inhibition (optional; warning-only if absent).
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    # Build first: docker compose run --rm dev cargo build --release --workspace
    command: /home/dev/target/release/moonshine

volumes:
  cargo-registry:
  cargo-git:
  target:
